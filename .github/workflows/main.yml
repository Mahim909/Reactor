name: CI

on: ["push", "pull_request"]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Add NuGet Feeds
        run: |
          dotnet nuget add source https://nuget.bepinex.dev/v3/index.json -n BepInEx || true
          dotnet nuget add source https://nuget.reactor.gg/v3/index.json -n Reactor || true

      - name: Find and Restore Solution
        run: |
          SLN_FILE=$(find . -name "*.sln" | head -n 1)
          echo "Restoring Solution: $SLN_FILE"
          dotnet restore "$SLN_FILE" --ignore-failed-sources

      - name: Find and Build Solution
        run: |
          SLN_FILE=$(find . -name "*.sln" | head -n 1)
          echo "Building Solution: $SLN_FILE"
          dotnet build "$SLN_FILE" -c Release --no-restore -p:CheckEolTargetFramework=false

      - name: Upload Mod Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImpostorReporterMod
          path: "**/bin/Release/**/*.dll"
