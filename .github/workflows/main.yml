name: CI

on: ["push", "pull_request"]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Add BepInEx & Reactor NuGet Feeds
        run: |
          dotnet nuget add source https://nuget.bepinex.dev/v3/index.json -n BepInEx || true
          dotnet nuget add source https://nuget.reactor.gg/v3/index.json -n Reactor || true

      - name: Restore Project Dependencies
        run: dotnet restore Reactor/Reactor.csproj

      - name: Build Core Project
        run: dotnet build Reactor/Reactor.csproj -c Release --no-restore

      - uses: actions/upload-artifact@v4
        with:
          name: Reactor.dll
          path: Reactor/bin/Release/net6.0/Reactor.dll
