name: CI

on: ["push", "pull_request"]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.cache/bepinex
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Reactor Solutions
        run: dotnet build Reactor.sln -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: Reactor.dll
          path: Reactor/bin/Release/net6.0/Reactor.dll

      - uses: actions/upload-artifact@v4
        with:
          name: Reactor.Example.dll
          path: Reactor.Example/bin/Release/net6.0/Reactor.Example.dll

      - uses: actions/upload-artifact@v4
        with:
          name: Reactor.Debugger.dll
          path: Reactor.Debugger/bin/Release/net6.0/Reactor.Debugger.dll

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          draft: true
          files: Reactor/bin/Release/net6.0/Reactor.dll
