name: Build Impostor Reporter Mod

on: ["push", "pull_request", "workflow_dispatch"]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Create Fresh Mod Project
        run: |
          mkdir -p ModProject
          cd ModProject
          dotnet new classlib --output . --force -f net6.0
          
          dotnet nuget add source https://nuget.bepinex.dev/v3/index.json -n BepInEx || true
          
          dotnet add package BepInEx.Unity.IL2CPP --version 6.0.0-be.692 || true
          dotnet add package UnityEngine.Modules --version 2021.3.16 || true

      - name: Inject Game Hook & Firebase Live Code
        run: |
          cat << 'EOF' > ModProject/Plugin.cs
          using System;
          using System.Net;
          using System.Text;
          using BepInEx;
          using BepInEx.Unity.IL2CPP;
          using UnityEngine;

          namespace ImpostorReporter
          {
              [BepInPlugin("com.mahim.impostorreporter", "Impostor Reporter", "1.0.0")]
              [BepInProcess("Among Us.exe")]
              public class Plugin : BasePlugin
              {
                  public override void Load()
                  {
                      Log.LogInfo("Impostor Reporter Loaded!");
                      AddComponent<ReporterBehaviour>();
                  }
              }

              public class ReporterBehaviour : MonoBehaviour
              {
                  private string firebaseUrl = "https://free-fire-panel-a9787-default-rtdb.firebaseio.com/";
                  private float timer = 0f;

                  void Update()
                  {
                      timer += Time.deltaTime;
                      if (timer >= 3f) // প্রতি ৩ সেকেন্ড পর পর চেক করবে
                      {
                          timer = 0f;
                          TrackAndReport();
                      }
                  }

                  private void TrackAndReport()
                  {
                      try
                      {
                          // 1. Send Connection Ping
                          SendFirebaseData("status.json", "{\"online\": true, \"last_updated\": \"" + DateTime.UtcNow.ToString() + "\"}");

                          // 2. Try Fetching Room Code & Impostor via Reflection
                          Type clientType = Type.GetType("AmongUsClient, Assembly-CSharp");
                          if (clientType != null)
                          {
                              var instanceProp = clientType.GetProperty("Instance");
                              var instance = instanceProp?.GetValue(null);
                              if (instance != null)
                              {
                                  var gameIdProp = clientType.GetField("GameId") ?? clientType.GetProperty("GameId") as System.Reflection.MemberInfo;
                                  string roomCode = "LOBBY";
                                  
                                  SendFirebaseData("live_room.json", "{\"room_code\": \"" + roomCode + "\", \"active\": true}");
                              }
                          }
                      }
                      catch { }
                  }

                  private void SendFirebaseData(string path, string json)
                  {
                      try
                      {
                          using (WebClient wc = new WebClient())
                          {
                              wc.Headers[HttpRequestHeader.ContentType] = "application/json";
                              wc.UploadStringAsync(new Uri(firebaseUrl + path), "PUT", json);
                          }
                      }
                      catch { }
                  }
              }
          }
          EOF

      - name: Build Mod DLL
        run: |
          cd ModProject
          dotnet build -c Release

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImpostorReporterMod
          path: "ModProject/bin/Release/net6.0/*.dll"
