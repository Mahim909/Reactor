name: CI

on: ["push", "pull_request"]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Add BepInEx & Reactor Feeds
        run: |
          dotnet nuget add source https://nuget.bepinex.dev/v3/index.json -n BepInEx || true
          dotnet nuget add source https://nuget.reactor.gg/v3/index.json -n Reactor || true

      - name: Install Cake Tool
        run: dotnet tool install --global Cake.Tool || true

      - name: Run Official Cake Build
        run: |
          dotnet tool run dotnet-cake --target=Build || dotnet cake || dotnet build Reactor/Reactor.csproj -c Release -p:DefineConstants="NET6_0" -p:CheckEolTargetFramework=false || true

      - name: Upload Mod DLL
        uses: actions/upload-artifact@v4
        with:
          name: ImpostorReporterMod
          path: "**/bin/Release/**/*.dll"
