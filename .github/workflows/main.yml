name: CI

on: ["push", "pull_request"]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Add BepInEx & Reactor NuGet Feeds
        run: |
          dotnet nuget add source https://nuget.bepinex.dev/v3/index.json -n BepInEx || true
          dotnet nuget add source https://nuget.reactor.gg/v3/index.json -n Reactor || true

      - name: Build Example Plugin Only
        run: |
          TARGET_PROJ=$(find . -maxdepth 2 -name "Reactor.Example.csproj" -o -name "*.csproj" | grep -v "Reactor.csproj" | head -n 1)
          echo "Building Target Project: $TARGET_PROJ"
          dotnet build "$TARGET_PROJ" -c Release --no-restore || dotnet build "$TARGET_PROJ" -c Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImpostorReporterMod
          path: "**/bin/Release/*/*.dll"
