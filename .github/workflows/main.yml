name: CI

on: ["push", "pull_request"]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Add Nuget Sources
        run: |
          dotnet nuget add source https://nuget.bepinex.dev/v3/index.json -n BepInEx || true
          dotnet nuget add source https://nuget.reactor.gg/v3/index.json -n Reactor || true

      - name: Restore Project
        run: dotnet restore Reactor/Reactor.csproj --ignore-failed-sources

      - name: Publish Mod
        run: dotnet publish Reactor/Reactor.csproj -c Release -o ./output /p:CheckEolTargetFramework=false || true

      - name: Upload Output Zip
        uses: actions/upload-artifact@v4
        with:
          name: ImpostorReporterMod
          path: output/
