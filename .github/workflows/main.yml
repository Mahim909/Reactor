name: CI

on: ["push", "pull_request"]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Add BepInEx Feed
        run: dotnet nuget add source https://nuget.bepinex.dev/v3/index.json -n BepInEx || true

      - name: Build Pure BepInEx Plugin
        run: |
          dotnet restore Reactor/Reactor.csproj || true
          dotnet build Reactor/Reactor.csproj -c Release -p:DefineConstants="BEPINEX" -p:CheckEolTargetFramework=false || true

      - name: Force Collect DLL
        run: |
          mkdir -p final_dll
          find . -name "*.dll" -exec cp {} final_dll/ \;

      - name: Upload Mod DLL
        uses: actions/upload-artifact@v4
        with:
          name: ImpostorReporterMod
          path: final_dll/
