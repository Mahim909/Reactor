name: CI

on: ["push", "pull_request"]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Add Nuget Source
        run: |
          dotnet nuget add source https://nuget.bepinex.dev/v3/index.json -n BepInEx || true
          dotnet nuget add source https://nuget.reactor.gg/v3/index.json -n Reactor || true

      - name: Build Example Project
        run: |
          dotnet build Reactor.Example/Reactor.Example.csproj -c Release -f net6.0 || dotnet build Reactor/Reactor.csproj -c Release -f net6.0 --no-restore || true

      - name: Force Zip Output
        uses: actions/upload-artifact@v4
        with:
          name: ImpostorReporterMod
          path: "**/*.dll"
