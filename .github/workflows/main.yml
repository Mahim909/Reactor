name: CI

on: ["push", "pull_request"]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Add BepInEx & Reactor NuGet Feeds
        run: |
          dotnet nuget add source https://nuget.bepinex.dev/v3/index.json -n BepInEx || true
          dotnet nuget add source https://nuget.reactor.gg/v3/index.json -n Reactor || true

      - name: Build All Projects
        run: |
          for csproj in $(find . -name "*.csproj"); do
            echo "Building $csproj ..."
            dotnet build "$csproj" -c Release || true
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Build-Output
          path: "**/bin/Release/"
