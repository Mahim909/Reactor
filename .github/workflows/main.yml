name: CI

on: ["push", "pull_request"]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Add NuGet Feeds
        run: |
          dotnet nuget add source https://nuget.bepinex.dev/v3/index.json -n BepInEx || true
          dotnet nuget add source https://nuget.reactor.gg/v3/index.json -n Reactor || true

      - name: Restore Oxygen and Dependencies
        run: |
          dotnet add Reactor/Reactor.csproj package Reactor.Oxygen --version 0.4.0 || true
          dotnet restore Reactor/Reactor.csproj --ignore-failed-sources

      - name: Force Build Mod
        run: |
          dotnet build Reactor/Reactor.csproj -c Release --no-restore -p:CheckEolTargetFramework=false || true

      - name: Collect and Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: ImpostorReporterMod
          path: "**/bin/**/*.dll"
